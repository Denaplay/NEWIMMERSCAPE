<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Почта подтверждена | Immerscape</title>
  <meta name="description" content="Подтверждение email для аккаунта Immerscape." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/email-confirmed.css" />
</head>
<body>
  <main class="confirmation-page">
    <a class="confirmation-brand" href="/" aria-label="Immerscape — на главную">immerscape</a>
    <section class="confirmation-card" aria-labelledby="confirmationTitle">
      <div class="confirmation-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" role="img">
          <circle cx="24" cy="24" r="21"></circle>
          <path d="m14.5 24.5 6 6 13-14"></path>
        </svg>
      </div>
      <p class="confirmation-kicker">Аккаунт активирован</p>
      <h1 id="confirmationTitle">Email подтверждён</h1>
      <p id="confirmationText">Регистрация завершена. Теперь вы можете войти в аккаунт и пользоваться личным профилем.</p>
      <a class="confirmation-action" id="confirmationAction" href="/#auth">Войти в аккаунт</a>
      <a class="confirmation-home" href="/">Вернуться на главную</a>
    </section>
  </main>
  <script src="/js/email-confirmed.js"></script>
</body>
</html>
